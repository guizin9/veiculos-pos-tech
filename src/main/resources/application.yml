spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
      name: Veículos API
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/veiculos}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
server:
  port: ${SERVER_PORT:8083}
  servlet:
    session:
     tracking-modes: cookie

logging:
  level:
    # SQL e bind ficam em WARN para não vazar dados pessoais (LGPD) nos logs
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

# Configurações de negócio da compra (Processo/SAGA)
app:
  jwt:
    # Segredo HMAC (mínimo 32 caracteres). Em produção use variável de ambiente / Secrets Manager.
    secret: ${JWT_SECRET:troque-este-segredo-para-um-valor-forte-com-32+chars}
    expiracao-min: ${JWT_EXPIRACAO_MIN:120}
  reserva:
    # Tempo (em minutos) até a reserva/pagamento expirar
    minutos-expiracao: ${RESERVA_MINUTOS_EXPIRACAO:30}
    # Intervalo (ms) da verificação automática de expiração
    intervalo-verificacao-ms: ${RESERVA_INTERVALO_VERIFICACAO_MS:60000}
