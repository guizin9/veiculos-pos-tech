spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
      name: Veículos API
  datasource:
    url: jdbc:postgresql://localhost:5433/veiculos
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
server:
  port: 8083
  servlet:
    session:
     tracking-modes: cookie

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# Configurações de negócio da compra (Processo/SAGA)
app:
  reserva:
    # Tempo (em minutos) até a reserva/pagamento expirar
    minutos-expiracao: ${RESERVA_MINUTOS_EXPIRACAO:30}
    # Intervalo (ms) da verificação automática de expiração
    intervalo-verificacao-ms: ${RESERVA_INTERVALO_VERIFICACAO_MS:60000}
